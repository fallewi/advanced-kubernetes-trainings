apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: my-ns
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"

      path: "kvv2"

      version: "v2"

      auth:
        kubernetes:
          mountPath: "demo-auth-mount"
          role: "demo"

          serviceAccountRef:
            name: default
            audiences:
              - vault
