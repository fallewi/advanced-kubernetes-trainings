apiVersion: v1
kind: Pod
metadata:
  name: network-connectivity-issue-pod
  labels:
    app: network-test
spec:
  containers:
  - name: busybox
    image: busybox
    command: ["sh", "-c", "wget -qO- --timeout=5 http://google.com || echo blocked; sleep 3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-egress-network-test
spec:
  podSelector:
    matchLabels:
      app: network-test
  policyTypes:
  - Egress
