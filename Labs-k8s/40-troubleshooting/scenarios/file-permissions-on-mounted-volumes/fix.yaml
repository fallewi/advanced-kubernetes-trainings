apiVersion: v1
kind: Pod
metadata:
  name: file-permissions-issue-fixed-pod
spec:
  containers:
  - name: busybox
    image: busybox
    command: ["sh", "-c", "echo test > /tmp/test.txt && sleep 3600"]
    securityContext:
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir: {}
