apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler-issue-deployment
spec:
  replicas: 20
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
