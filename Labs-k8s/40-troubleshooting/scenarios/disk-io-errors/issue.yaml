apiVersion: v1
kind: Pod
metadata:
  name: disk-io-error-pod
spec:
  containers:
  - name: busybox
    image: busybox
    command: ["sh", "-c", "cat /data/myfile.txt && sleep 3600"]
    volumeMounts:
    - mountPath: /data
      name: data-volume
      readOnly: true
  volumes:
  - name: data-volume
    hostPath:
      path: /nonexistent-path
      type: Directory
