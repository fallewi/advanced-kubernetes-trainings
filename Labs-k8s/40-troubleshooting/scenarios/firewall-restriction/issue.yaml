apiVersion: v1
kind: Pod
metadata:
  name: firewall-restriction-pod
  labels:
    app: firewall-test
spec:
  containers:
  - name: busybox
    image: busybox
    command: ["sh", "-c", "wget -qO- --timeout=5 http://google.com || echo 'blocked'; sleep 3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
spec:
  podSelector:
    matchLabels:
      app: firewall-test
  policyTypes:
  - Egress
